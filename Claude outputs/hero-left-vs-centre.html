<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hero Alignment Comparison</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f2f2f0;--ink:#0a0a0a;--muted:#6b7280}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;padding:28px 16px 40px}
  h1.t{font-size:15px;font-weight:600;letter-spacing:.02em;margin:0 auto 4px;max-width:1360px}
  p.s{font-size:13px;color:var(--muted);margin:0 auto 22px;max-width:1360px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:1360px;margin:0 auto}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .lab{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .viewport{width:100%;aspect-ratio:1280/760;overflow:hidden;position:relative;background:#fff;box-shadow:0 1px 0 #e5e7eb,0 10px 30px rgba(0,0,0,.06)}
  .viewport > .frame{position:absolute;left:0;top:0;width:1280px;height:760px;transform-origin:0 0}
  /* the homepage, at desktop size, using the live values */
  .frame{background:#fff;overflow:hidden}
  .plate{position:absolute;right:-3%;top:64px;height:1150px;width:auto;opacity:.13;z-index:0}
  .nav{position:absolute;top:0;left:0;right:0;height:64px;z-index:3}
  .navin{max-width:calc(72rem + 3rem);margin:0 auto;height:100%;padding:0 24px;display:flex;align-items:center;justify-content:space-between}
  .icons{display:flex;gap:16px;margin-right:-8px}
  .hero{position:relative;z-index:1;height:260px;display:flex;align-items:flex-start}
  .body{max-width:72rem;margin:0 auto;width:100%;padding:56px 24px 0}
  .lock{display:inline-flex;flex-direction:column;gap:14px;margin:0 0 54px;line-height:1}
  .lock img{height:64px;width:auto;display:block;margin:-12px 0 12px}
  .lock span{font-size:36px;font-weight:600;letter-spacing:.22em;margin-right:-.22em}
  .eyeb{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#6b7280}
  .eyeb i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#0a0a0a;margin-right:14px;vertical-align:middle;position:relative;top:-1px}
  .center .body{text-align:center}.center .lock{align-items:center}
  .left .body{text-align:left}.left .lock{flex-direction:row;align-items:center;gap:18px;margin-bottom:40px}.left .lock img{height:52px;margin:0}.left .lock span{margin-right:0;font-size:36px}
  .photos{position:relative;z-index:1;max-width:72rem;margin:0 auto;padding:12px 24px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .photos img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
</style></head><body>
