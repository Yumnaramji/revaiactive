<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#e5e5e5;font-family:Inter,Helvetica,Arial,sans-serif}
  .lbl{font-size:22px;font-weight:600;padding:22px 32px 10px;margin:0;color:#0a0a0a}
  .hero{position:relative;width:1280px;aspect-ratio:2048/1152;overflow:hidden;margin:0 0 8px}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 0%}
  .shade{position:absolute;left:0;bottom:0;width:60%;height:55%;background:linear-gradient(to top right,rgba(0,0,0,.55),rgba(0,0,0,0) 60%)}
  .copy{position:absolute;left:56px;bottom:56px;color:#fff}
  /* A */
  .a h2{margin:0 0 20px;font-size:44px;font-weight:600;letter-spacing:-.02em;line-height:1.05}
  .a .btn{display:inline-block;background:#fff;color:#0a0a0a;font-size:14px;font-weight:600;padding:14px 28px;border-radius:4px;text-decoration:none}
  /* B */
  .b h2{margin:0 0 16px;font-size:36px;font-weight:500;letter-spacing:-.01em;line-height:1.1}
  .b .link{color:#fff;font-size:14px;font-weight:500;text-decoration:none;border-bottom:1px solid #fff;padding-bottom:4px}
  /* C */
  .c .eyeb{font-size:11px;letter-spacing:.32em;text-transform:uppercase;opacity:.85;margin:0 0 14px}
  .c h2{margin:0 0 22px;font-size:48px;font-weight:300;letter-spacing:-.02em;line-height:1.05}
  .c .btn{display:inline-block;border:1px solid #fff;color:#fff;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:13px 30px;text-decoration:none}
  /* D */
  .d h2{margin:0 0 18px;font-size:13px;font-weight:600;letter-spacing:.32em;text-transform:uppercase}
  .d .btn{display:inline-block;background:#0a0a0a;color:#fff;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:14px 32px;text-decoration:none}
</style></head><body>
<p class="lbl">A — bold title, white button</p>
<div class="hero"><img src="../images/hero-photo.jpg"><div class="shade"></div>
  <div class="copy a"><h2>A return to you</h2><a class="btn">Shop now</a></div></div>

<p class="lbl">B — medium title, underlined link</p>
<div class="hero"><img src="../images/hero-photo.jpg"><div class="shade"></div>
  <div class="copy b"><h2>A return to you</h2><a class="link">Shop now &rarr;</a></div></div>

<p class="lbl">C — small eyebrow, light large title, outline button</p>
<div class="hero"><img src="../images/hero-photo.jpg"><div class="shade"></div>
  <div class="copy c"><p class="eyeb">Collection 01</p><h2>A return to you</h2><a class="btn">Shop now</a></div></div>

<p class="lbl">D — quiet spaced capitals, black button</p>
<div class="hero"><img src="../images/hero-photo.jpg"><div class="shade"></div>
  <div class="copy d"><h2>A return to you</h2><a class="btn">Shop now</a></div></div>
</body></html>
