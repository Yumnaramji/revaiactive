<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REVAÍ — Coming soon</title>
<meta name="description" content="REVAÍ. Coming soon to Nairobi.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/favicon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#050505;color:#fff;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  .wrap{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;text-align:center}
  .glow{position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 55%,rgba(255,255,255,.07),transparent 70%);pointer-events:none}
  .mark{position:absolute;right:-8vmin;top:50%;transform:translateY(-50%);height:118vmin;width:auto;opacity:.05;pointer-events:none;filter:invert(1)}
  .lock{display:flex;align-items:center;gap:14px;opacity:0;animation:in 1.4s cubic-bezier(.16,1,.3,1) .2s forwards}
  .lock img{height:40px;width:auto;filter:invert(1)}
  .lock span{font-size:26px;font-weight:600;letter-spacing:.32em;margin-right:-.32em}
  .line{width:1px;height:56px;background:linear-gradient(#fff0,#ffffff55,#fff0);margin:38px 0 34px;opacity:0;animation:in 1.4s cubic-bezier(.16,1,.3,1) .6s forwards}
  .soon{font-size:12px;font-weight:500;letter-spacing:.36em;text-transform:uppercase;color:#d4d4d4;margin-right:-.36em;opacity:0;animation:in 1.4s cubic-bezier(.16,1,.3,1) .9s forwards}
  .where{margin-top:14px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#6b7280;margin-right:-.24em;opacity:0;animation:in 1.4s cubic-bezier(.16,1,.3,1) 1.1s forwards}
  .ig{position:absolute;bottom:34px;left:0;right:0;text-align:center;opacity:0;animation:in 1.4s cubic-bezier(.16,1,.3,1) 1.4s forwards}
  .ig a{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#a3a3a3;text-decoration:none;border-bottom:1px solid #333;padding-bottom:4px;transition:color .2s,border-color .2s}
  .ig a:hover{color:#fff;border-color:#888}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.lock,.line,.soon,.where,.ig{animation:none;opacity:1}}
  @media(max-width:480px){.lock img{height:32px}.lock span{font-size:21px}.mark{right:-30vmin;height:140vmin}}
</style>
</head>
<body>
  <main class="wrap">
    <div class="glow"></div>
    <img class="mark" src="/revai-icon.png" alt="" aria-hidden="true">
    <div class="lock"><img src="/revai-icon.png" alt=""><span>REVAÍ</span></div>
    <div class="line" aria-hidden="true"></div>
    <p class="soon">Coming soon</p>
    <p class="where">Nairobi</p>
    <div class="ig"><a href="https://instagram.com/revaiactive">@revaiactive</a></div>
  </main>
</body>
</html>
